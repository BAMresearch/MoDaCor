name: Release PR

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checking out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setting up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        shell: sh
        run: |
          [ -d "/c/miniconda" ] && /c/miniconda/condabin/activate.bat
          python -m pip install --upgrade pip
          python -m pip install --progress-bar=off .[ci]

      - name: Read current package version
        id: current
        shell: sh
        run: |
          set -eu
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/modacor/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("Could not find src/modacor/__init__.py __version__")
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        id: semver
        if: steps.current.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: sh
        run: |
          set -eu
          NEWVER=$(semantic-release version --print)
          [ -z "$NEWVER" ] && exit 1
          LASTVER=$(semantic-release version --print-last-released 2>/dev/null || true)
          echo "version=$NEWVER" >> "$GITHUB_OUTPUT"
          if [ "$NEWVER" = "$LASTVER" ]; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release files
        if: steps.semver.outputs.release_needed == 'true'
        env:
          NEWVER: ${{ steps.semver.outputs.version }}
        shell: sh
        run: |
          set -eu
          sed -i -e "s/v\([0-9]\+\.\)\{2\}\([0-9]\+\)/v$NEWVER/g" README.md
          sed -i -e "/version:/s/\([0-9]\+\.\)\{2\}[0-9]\+/$NEWVER/" .copier-answers.yml
          semantic-release version --no-commit --no-tag --no-push --no-vcs-release

      - name: Create release pull request
        if: steps.semver.outputs.release_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/semantic-release
          delete-branch: true
          commit-message: "chore(release): prepare v${{ steps.semver.outputs.version }}"
          title: "chore(release): prepare v${{ steps.semver.outputs.version }}"
          body: |
            Automated release preparation generated by python-semantic-release.

            This PR updates version stamps and the changelog. After it is merged
            into `main`, the release workflow will tag the merged commit and the
            package publishing job can publish the built artifacts.
