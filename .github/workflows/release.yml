name: Release

on:
  workflow_call:
    outputs:
      new_version:
        description: Whether this run created a new version tag.
        value: ${{ jobs.release.outputs.new_version }}

jobs:
  release:
    # Release PRs carry version/changelog updates through normal branch
    # protection. This job only tags an already-versioned main commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - name: Checking out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Read package version
        id: version
        shell: sh
        run: |
          set -eu
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/modacor/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("Could not find src/modacor/__init__.py __version__")
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release file versions
        shell: sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ["VERSION"]
          checks = {
              "src/modacor/__init__.py": r'__version__\s*=\s*"([^"]+)"',
              "docs/conf.py": r'version\s*=\s*"([^"]+)"',
              ".copier-answers.yml": r"(?m)^version:\s*([0-9]+(?:\.[0-9]+){2})\s*$",
          }
          for filename, pattern in checks.items():
              text = Path(filename).read_text()
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Could not find version in {filename}")
              if match.group(1) != expected:
                  raise SystemExit(f"{filename} has version {match.group(1)}, expected {expected}")
          PY

      - name: Create version tag if needed
        id: tag
        shell: sh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "new_version=true" >> "$GITHUB_OUTPUT"
