[tox]
requires =
    tox>=4.0
envlist =
    clean,
    build,
    lint,
    manifest,
    docs,
    py312,
    py313,
    py314,
    report

[testenv]
basepython =
    py312: {env:TOXPYTHON312:python3.12}
    py313: {env:TOXPYTHON313:python3.13}
    py314: {env:TOXPYTHON314:python3.14}
    {bootstrap,clean,build,check,lint,manifest,report,docs,linkcheck,py}: {env:TOXPYTHON:python3.12}
setenv =
    PYTHONUNBUFFERED=yes
    # fix wrong cp1252 on Windows when loading a notebook with dash (or other unicode symbols)
    # since locale.getpreferredencoding can't be changed easily
    PYTHONUTF8=1
    py: COVERAGE_FILE={toxworkdir}/.coverage.{envname}
    py312: COVERAGE_FILE={toxworkdir}/.coverage.{envname}
    py313: COVERAGE_FILE={toxworkdir}/.coverage.{envname}
    py314: COVERAGE_FILE={toxworkdir}/.coverage.{envname}
extras =
    tests  # Installs [project.optional-dependencies.tests]
    server  # Server API tests are part of the default test suite.
usedevelop = false
package = wheel
# https://tox.wiki/en/latest/user_guide.html#packaging
package_env = .pkg
wheel_build_env = .pkg
commands =
    pytest --cov-config=tox.ini --cov=src --cov=tests --cov-report=term-missing -vv {posargs}

[testenv:build]
deps = build
skip_install = true
commands = python -m build

[testenv:check]
deps =
    check-manifest
    flake8
    isort
skip_install = true
commands =
    flake8 src tests
    isort --check-only --diff --filter-files src tests
    check-manifest {toxinidir}

[testenv:lint]
deps =
    flake8
    isort
skip_install = true
commands =
    flake8 src tests
    isort --check-only --diff --filter-files src tests

[testenv:manifest]
deps =
    check-manifest
skip_install = true
commands =
    check-manifest {toxinidir}

[testenv:docs]
extras =
    docs  # Installs [project.optional-dependencies.docs]
usedevelop = true
commands =
    python scripts/generate_module_doc.py --all --output-dir docs/reference/modules --index docs/reference/modules/index.md
    #sphinx-build {posargs:-E} -b doctest docs dist/docs
    sphinx-build {posargs:-E} -b html docs dist/docs

[testenv:linkcheck]
extras =
    docs
usedevelop = true
commands =
    python scripts/generate_module_doc.py --all --output-dir docs/reference/modules --index docs/reference/modules/index.md
    sphinx-build -b linkcheck docs dist/docs/linkcheck

[testenv:report]
deps =
    coverage
skip_install = true
depends =
    py312
    py313
    py314
commands =
    coverage combine --keep {toxworkdir}
    coverage report
    coverage html

[testenv:clean]
deps =
    coverage
skip_install = true
allowlist_externals=/bin/rm,/usr/bin/rm,rm
commands =
    coverage erase
    rm -f {toxworkdir}/.coverage.py {toxworkdir}/.coverage.py312 {toxworkdir}/.coverage.py313 {toxworkdir}/.coverage.py314
    rm -Rf dist build htmlcov src/modacor.egg-info

[pytest]
# If a pytest section is found in one of the possible config files
# (pytest.ini, tox.ini or setup.cfg), then pytest will not look for any others,
# so if you add a pytest config section elsewhere,
# you will need to delete this section from setup.cfg.
norecursedirs =
    migrations
minversion = 6.0
python_files =
    *.py # for doctests
    test_*.py
    *_test.py
    tests.py
addopts =
    -ra
    --strict-markers
    --doctest-modules
    --doctest-glob=\*.rst
    --tb=short
    --ignore-glob=\*/.ipynb_checkpoints
testpaths =
    src
    tests
# Idea from: https://til.simonwillison.net/pytest/treat-warnings-as-errors
filterwarnings =
    ignore::DeprecationWarning:distutils|_pytest|xarray|debugpy
    ignore::DeprecationWarning:pkg_resources|openpyxl|zmq

# configuration for pytest-cov primarily on GitHub runners (hence the paths)
[coverage:paths]
src =
   src
   */MoDaCor/MoDaCor/src
tests =
   tests
   */MoDaCor/MoDaCor/tests

[coverage:run]
branch = true
source =
    src/modacor
    tests
parallel = true

[coverage:report]
show_missing = true
precision = 2
omit = *migrations*
